<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 동네 문제 원인 탐정</title><style>:root{--ink:#17324d;--muted:#5f7182;--line:#dbe5ec;--paper:#fff;--bg:#f3f8fb;--accent:#1877b9;--soft:#e9f5fc}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:920px;margin:auto;padding:36px 18px 64px}.hero{text-align:center;margin-bottom:24px}.hero h1{font-size:clamp(28px,5vw,44px);margin:0 0 10px}.hero p{color:var(--muted);font-size:17px;line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 30px #24425a12}label{font-weight:800;display:block;margin-bottom:10px}textarea{width:100%;min-height:105px;resize:vertical;border:2px solid var(--line);border-radius:14px;padding:15px;font:inherit;outline:none}textarea:focus{border-color:var(--accent)}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 11px;cursor:pointer}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:var(--accent);color:white;font-weight:800;font-size:17px;cursor:pointer}#result{margin-top:22px}.hidden{display:none}.summary{background:var(--soft);border-radius:16px;padding:16px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:18px}.num{font-weight:900;font-size:13px;color:var(--accent)}.card h3{margin:6px 0 8px}.card p{color:var(--ink);line-height:1.7;margin:8px 0}.card ul{padding-left:20px;line-height:1.7;margin:10px 0}.card li{margin:8px 0}.intro{line-height:1.8;margin:0 0 16px}.searchlink{display:inline-block;margin:3px 5px 3px 0;padding:5px 9px;border-radius:9px;background:#e9f5fc;color:#075f98;text-decoration:none}.searchlink:focus,.searchlink:hover{text-decoration:underline}.small{color:var(--muted);font-size:14px}.query{background:#f6f8fa;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}.tip{margin-top:16px;color:var(--muted);font-size:14px;line-height:1.55}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><main><section class="hero"><h1>🔎 우리 동네 문제 원인 탐정</h1><p>우리 모둠이 선택한 지역 문제를 입력해 보세요.<br>문제의 <b>원인</b>을 알아보기 위해 찾아보면 좋은 자료를 추천해 드려요.</p></section><section class="panel"><label for="problem">우리 모둠이 선택한 지역 문제는 무엇인가요?</label><textarea id="problem" placeholder="예: 우리 지역 공원에 쓰레기가 많이 버려져 있어요."></textarea><div class="examples"><button class="chip" data-v="공원과 길거리에 쓰레기 무단투기가 많다">🗑️ 쓰레기</button><button class="chip" data-v="학교 주변에 불법 주정차가 많아 등하굣길이 위험하다">🚗 교통·안전</button><button class="chip" data-v="우리 지역의 오래된 시설이 낡고 이용하기 불편하다">🏚️ 노후 시설</button><button class="chip" data-v="바닷가와 하천에 쓰레기가 많아 환경이 오염되고 있다">🌊 환경 오염</button></div><button class="primary" id="go">어떤 자료를 찾아볼까?</button><div id="result" class="hidden"></div></section></main><script>
const problem=document.querySelector('#problem'),result=document.querySelector('#result');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{problem.value=b.dataset.v;problem.focus()});
const topics=[
{keys:/C1.{0,5}C2|C2.{0,5}C1/i, name:'개발 계획', source:'송도 C1 C2', steps:[
['뉴스에서 ‘어떤 일이 있었는지’ 알아보기','네이버 뉴스 또는 다음 뉴스','송도 C1 C2 개발 계획, 송도 C1 C2 주민 의견','처음 계획과 새 계획이 어떻게 다른지, 기사마다 언제 작성되었는지 살펴보세요.'],
['담당 기관의 ‘공식 계획’ 확인하기','인천경제자유구역청(IFEZ) 누리집','송도 C1 C2 개발계획, 송도 국제업무단지 개발계획','계획 문서의 날짜와 부지의 용도를 확인하고, 기사에서 말한 내용과 비교해 보세요.'],
['주민들의 목소리 살펴보기','인천시 시민 의견 게시판 또는 관련 기사','송도 C1 C2 주민 의견, 송도 C1 C2 청원','주민들이 직접 걱정하는 점이 무엇인지 적어 보세요. 주민 의견은 사실을 확인할 단서로 활용해요.'],
['지도로 주변 살펴보기','네이버 지도 또는 카카오맵의 지도·항공사진','송도 C1 부지, 송도 C2 부지','주변 도로·학교·건물의 위치를 살펴보고, 지도에서 알 수 없는 점은 따로 표시하세요.']
]},
{keys:/쓰레기|폐기물|무단투기|분리배출|재활용/,name:'쓰레기 문제',steps:[
['뉴스에서 ‘언제, 어디서 시작됐는지’ 찾기','네이버 뉴스 또는 다음 뉴스',null,'문제가 반복되는 장소와 시기, 주민과 담당 기관이 말하는 이유를 비교해 보세요.'],
['숫자로 ‘얼마나 심한지’ 알아보기','시청·구청 통계, 공공데이터포털',null,'쓰레기 배출량이나 무단투기 신고 건수가 해마다 어떻게 달라졌는지 찾아보세요.'],
['지도와 사진으로 ‘어디에 몰리는지’ 보기','네이버 지도 또는 카카오맵, 기사 사진',null,'사람이 많이 다니는 곳이나 수거 장소 주변에 문제가 집중되는지 살펴보세요.'],
['담당 기관의 자료 읽어보기','시청·구청 누리집의 청소·환경 자료',null,'수거 횟수나 시설 현황을 확인하고 숫자 자료와 함께 원인을 생각해 보세요.']
]},
{keys:/교통|주차|주정차|사고|통학|등하교/,name:'교통·안전 문제',steps:[
['뉴스에서 ‘무엇이 위험한지’ 찾기','네이버 뉴스 또는 다음 뉴스',null,'사람들이 겪는 불편과 사고가 생기는 시간·장소를 메모해 보세요.'],
['숫자로 ‘얼마나 자주 생기는지’ 보기','교통사고 통계, 시청·구청 자료',null,'사고나 신고 건수를 연도별로 비교하고 조사한 지역 범위를 확인하세요.'],
['지도로 ‘길의 모습’ 살펴보기','네이버 지도 또는 카카오맵',null,'횡단보도·신호등·정류장·주차장 위치를 표시해 보세요.'],
['담당 기관의 계획 확인하기','시청·구청 또는 경찰의 교통안전 자료',null,'안전 시설과 개선 계획을 찾아 문제의 원인과 연결되는지 생각해 보세요.']
]},
{keys:/바다|하천|환경|오염|미세먼지|악취/,name:'환경 문제',steps:[
['뉴스에서 ‘어디서 생기는지’ 찾기','네이버 뉴스 또는 다음 뉴스',null,'오염을 발견한 장소와 시기를 적고 기사마다 설명이 같은지 비교하세요.'],
['숫자로 ‘변화’를 살펴보기','공공데이터포털, 환경 관련 공공기관 자료',null,'수질·대기질 또는 수거량을 같은 지역과 같은 기간으로 비교하세요.'],
['지도와 사진으로 주변 살펴보기','네이버 지도 또는 카카오맵, 기사 사진',null,'주변 하천·도로·시설의 위치를 살펴보고 추측과 확인된 사실을 구분하세요.'],
['조사 결과 읽어보기','시청·구청 또는 환경 관련 기관의 보고서',null,'실제로 측정한 결과가 무엇인지 확인하고 기사 내용과 비교하세요.']
]},
{keys:/시설|공원|놀이터|노후|폐교|문화|도서관/,name:'시설 문제',steps:[
['뉴스에서 ‘어떤 불편인지’ 찾기','네이버 뉴스 또는 다음 뉴스',null,'누가 어떤 불편을 겪는지, 시설이 왜 문제가 되었는지 살펴보세요.'],
['시설과 인구의 숫자 확인하기','시청·구청 통계, 공공데이터포털',null,'시설 수·이용자 수·주변 인구가 어떻게 변했는지 비교하세요.'],
['지도와 사진으로 위치 살펴보기','네이버 지도 또는 카카오맵',null,'가까운 대체 시설과 이동 거리를 함께 살펴보세요.'],
['관리 기관의 자료 확인하기','시청·구청 또는 교육청의 시설 자료',null,'점검 결과와 관리 계획을 찾아 주민 의견과 비교해 보세요.']
]}];
const fallback=[
['뉴스로 문제의 시작 알아보기','네이버 뉴스 또는 다음 뉴스',null,'언제부터 어떤 일이 생겼는지, 기사 두 편의 설명을 비교해 보세요.'],
['숫자로 문제의 크기 확인하기','시청·구청 통계 또는 공공데이터포털',null,'몇 명 또는 몇 건에 영향을 주는지 같은 기간과 지역을 비교해 보세요.'],
['지도와 사진으로 장소 확인하기','네이버 지도 또는 카카오맵',null,'문제가 생기는 곳의 공통점을 찾고 지도에서 보이지 않는 정보도 적어 보세요.'],
['공공기관과 주민 의견 비교하기','시청·구청 누리집 또는 시민 의견 게시판',null,'기관의 설명과 주민의 경험이 같거나 다른 점을 표시해 보세요.']
];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function queryLinks(q){return q.split(',').map(v=>v.trim()).filter(Boolean).map(v=>'<a class="searchlink" href="https://search.naver.com/search.naver?query='+encodeURIComponent(v)+'" target="_blank" rel="noopener noreferrer">'+esc(v)+' ↗</a>').join('')}
function placeOf(p){let m=p.match(/(?:인천|송도|소래|부평|연수|남동|미추홀|계양|서구|중구|동구|강화|옹진)(?:국제업무지구|국제도시|구|군|동|역|공원|동네)?/);return m?m[0]:'우리 지역'}
document.querySelector('#go').onclick=()=>{
const p=problem.value.trim();if(!p){alert('먼저 우리 모둠의 지역 문제를 입력해 주세요.');problem.focus();return}
const t=topics.find(x=>x.keys.test(p)), place=placeOf(p),subject=t?.source||p.replace(/[.!?]/g,'').slice(0,65);
const steps=t?.steps||fallback;
result.classList.remove('hidden');
result.innerHTML='<div class="summary"><b>🔎 우리 모둠을 위한 맞춤형 자료 찾는 방법 (4가지)</b><p class="intro">반가워요, 여러분! <b>'+esc(p)+'</b>에 대해 조사하기로 했군요. 이 문제가 왜 생겼는지 알아보려면 여러 자료를 찾아 함께 비교해 보아요. 여러분도 충분히 할 수 있어요!</p><span class="small">아래 검색어는 조사 출발점이에요. 실제 자료가 있는지 열어 보고 확인해 주세요.</span></div><div class="grid">'+steps.map((x,i)=>{let q=x[2]||subject+' 원인, '+subject+' 통계, '+place+' '+(t?.name||'지역 문제')+' 현황';return '<article class="card"><span class="num">방법 '+(i+1)+'</span><h3>'+esc(x[0])+'</h3><ul><li><b>어디서 찾기:</b> '+esc(x[1])+'</li><li><b>무슨 검색어로 치기:</b><br>'+queryLinks(q)+'</li><li><b>무엇을 확인하기:</b> '+esc(x[3])+'</li></ul></article>'}).join('')+'</div><div class="tip"><b>💬 선생님의 한 마디!</b><br>어려운 말은 사전에서 찾아보고, 자료의 날짜와 출처를 적어 두세요. 서로 다른 자료 두 개 이상을 비교한 뒤 우리 모둠의 생각을 정리해 봅시다. 파이팅!</div>';
result.scrollIntoView({behavior:'smooth',block:'start'});
};
</script></body></html>
