<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 동네 문제 원인 탐정</title><style>:root{--ink:#17324d;--muted:#5f7182;--line:#dbe5ec;--paper:#fff;--bg:#f3f8fb;--accent:#1877b9;--soft:#e9f5fc}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:920px;margin:auto;padding:36px 18px 64px}.hero{text-align:center;margin-bottom:24px}.hero h1{font-size:clamp(28px,5vw,44px);margin:0 0 10px}.hero p{color:var(--muted);font-size:17px;line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 30px #24425a12}label{font-weight:800;display:block;margin-bottom:10px}textarea{width:100%;min-height:105px;resize:vertical;border:2px solid var(--line);border-radius:14px;padding:15px;font:inherit;outline:none}textarea:focus{border-color:var(--accent)}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 11px;cursor:pointer}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:var(--accent);color:white;font-weight:800;font-size:17px;cursor:pointer}#result{margin-top:22px}.hidden{display:none}.summary{background:var(--soft);border-radius:16px;padding:16px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:18px}.num{font-weight:900;font-size:13px;color:var(--accent)}.card h3{margin:6px 0 8px}.card p{color:var(--muted);line-height:1.55;margin:6px 0}.query{background:#f6f8fa;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}.tip{margin-top:16px;color:var(--muted);font-size:14px;line-height:1.55}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><main><section class="hero"><h1>🔎 우리 동네 문제 원인 탐정</h1><p>우리 모둠이 선택한 지역 문제를 입력해 보세요.<br>문제의 <b>원인</b>을 알아보기 위해 찾아보면 좋은 자료를 추천해 드려요.</p></section><section class="panel"><label for="problem">우리 모둠이 선택한 지역 문제는 무엇인가요?</label><textarea id="problem" placeholder="예: 우리 지역 공원에 쓰레기가 많이 버려져 있어요."></textarea><div class="examples"><button class="chip" data-v="공원과 길거리에 쓰레기 무단투기가 많다">🗑️ 쓰레기</button><button class="chip" data-v="학교 주변에 불법 주정차가 많아 등하굣길이 위험하다">🚗 교통·안전</button><button class="chip" data-v="우리 지역의 오래된 시설이 낡고 이용하기 불편하다">🏚️ 노후 시설</button><button class="chip" data-v="바닷가와 하천에 쓰레기가 많아 환경이 오염되고 있다">🌊 환경 오염</button></div><button class="primary" id="go">어떤 자료를 찾아볼까?</button><div id="result" class="hidden"></div></section></main><script>
const problem=document.querySelector('#problem'),result=document.querySelector('#result');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>problem.value=b.dataset.v);
const groups=[
{keys:['쓰레기','폐기물','무단투기','분리배출','재활용'],items:[['통계 자료','우리 지역의 쓰레기 발생량, 무단투기 신고 건수, 재활용률 등이 해마다 어떻게 변했는지 살펴보세요.','지역명 쓰레기 발생량 통계 / 지역명 무단투기 신고 건수'],['추가 뉴스 기사','언제부터 문제가 커졌는지, 주민·상인·행정기관은 원인을 무엇이라고 말하는지 찾아보세요.','지역명 쓰레기 무단투기 원인 / 지역명 폐기물 문제'],['지도·현장 자료','쓰레기가 특히 많이 생기는 장소와 시간대가 있는지 지도, 사진, 현장 기록을 비교해 보세요.','지역명 무단투기 상습지역 / 지역명 쓰레기 민원'],['공공기관 자료','구청·시청의 청소 인력, 수거 횟수, 쓰레기통 위치, 관련 민원 자료를 찾아보세요.','지역명 구청 청소행정 쓰레기 민원']]},
{keys:['교통','주차','주정차','사고','안전','통학'],items:[['교통·사고 통계','사고 건수, 불법 주정차 신고, 교통량 등 숫자 자료로 문제가 실제로 어느 정도인지 확인하세요.','지역명 교통사고 통계 / 지역명 불법주정차 신고'],['추가 뉴스 기사','사고나 혼잡이 생기는 이유를 주민, 경찰, 전문가가 어떻게 설명하는지 비교하세요.','지역명 교통 문제 원인 / 지역명 통학로 안전'],['지도·시설 자료','횡단보도, 신호등, 주차장, 버스정류장 위치와 도로 구조를 살펴보세요.','지역명 교통안전시설 / 지역명 주차장 현황'],['공공기관 자료','시청·구청·경찰청 자료에서 교통 개선 계획이나 민원 내용을 확인하세요.','지역명 교통 민원 / 지역명 교통안전 계획']]},
{keys:['바다','하천','환경','오염','미세먼지','악취'],items:[['환경 통계','수질, 대기질, 쓰레기 수거량 등 시간에 따라 비교할 수 있는 숫자 자료를 찾아보세요.','지역명 환경 통계 / 지역명 수질 대기질'],['추가 뉴스 기사','오염이 발생한 장소·시기와 기사에서 제시하는 원인을 서로 비교해 보세요.','지역명 환경오염 원인 / 지역명 하천 바다 쓰레기'],['지도·사진 자료','오염이 심한 장소 주변에 어떤 시설, 도로, 하천 등이 있는지 지도와 사진으로 살펴보세요.','지역명 환경오염 지도 / 지역명 하천 현황'],['공공기관·연구 자료','환경부, 시청, 구청 등의 조사 보고서에서 측정 결과와 원인 분석을 찾아보세요.','지역명 환경 조사 보고서 / 지역명 환경부 자료']]},
{keys:['시설','공원','놀이터','노후','폐교','문화','도서관'],items:[['시설 현황 통계','시설의 개수, 만들어진 연도, 이용자 수, 보수 횟수 등을 찾아 다른 지역이나 연도와 비교하세요.','지역명 시설 현황 통계 / 지역명 공공시설 이용자 수'],['추가 뉴스 기사','주민들이 어떤 불편을 겪고 있는지, 오래된 시설이 생긴 배경은 무엇인지 찾아보세요.','지역명 노후시설 문제 / 지역명 공공시설 불편'],['인구·이용 자료','주변 인구의 변화나 연령대, 시설 이용자 변화를 살펴 문제와 관련이 있는지 생각해 보세요.','지역명 인구 변화 통계 / 지역명 연령별 인구'],['공공기관 자료','시청·구청의 시설 점검 결과, 예산, 정비 계획, 주민 민원을 확인하세요.','지역명 시설 안전점검 / 지역명 시설 정비 계획']]}];
const generic=[['숫자로 확인하는 통계 자료','문제가 얼마나 심한지, 언제부터 변화했는지 알 수 있는 통계 자료를 찾아보세요.','지역명 + 문제 핵심어 + 통계 / 현황'],['원인을 다룬 추가 뉴스 기사','같은 문제를 다룬 다른 기사를 찾아 원인에 대한 설명이 서로 같은지 비교해 보세요.','지역명 + 문제 핵심어 + 원인 / 문제'],['지도·사진·현장 자료','문제가 주로 어디에서 생기는지 지도와 사진을 살펴보고 장소의 공통점을 찾아보세요.','지역명 + 문제 핵심어 + 지도 / 현황'],['시청·구청 등 공공기관 자료','민원, 조사 보고서, 시설 현황 등 믿을 수 있는 공공자료를 찾아보세요.','지역명 + 문제 핵심어 + 시청 / 구청 / 공공데이터']];
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelector('#go').onclick=()=>{const p=problem.value.trim();if(!p){alert('먼저 우리 모둠의 지역 문제를 입력해 주세요.');return}const g=groups.find(g=>g.keys.some(k=>p.includes(k))),items=g?g.items:generic;result.classList.remove('hidden');result.innerHTML='<div class="summary"><b>🕵️ 조사할 문제</b><br>'+esc(p)+'</div><div class="grid">'+items.map((x,i)=>'<article class="card"><span class="num">자료 '+(i+1)+'</span><h3>'+x[0]+'</h3><p>'+x[1]+'</p><div class="query"><b>🔍 검색어 예시</b><br>'+x[2]+'</div></article>').join('')+'</div><div class="tip">💡 <b>원인 탐정의 약속:</b> 한 자료만 보고 원인을 정하지 말고, 서로 다른 자료 2개 이상을 비교해 보세요. 숫자 자료는 조사한 연도와 지역도 꼭 확인하세요.</div>';result.scrollIntoView({behavior:'smooth',block:'start'})};
</script></body></html>
