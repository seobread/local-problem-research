und:#f6f8fa;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}.tip{margin-top:16px;color:var(--muted);font-size:14px;line-height:1.55}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><main><section class="hero"><h1>🔎 우리 동네 문제 원인 탐정</h1><p>우리 모둠이 선택한 지역 문제를 입력해 보세요.<br>문제의 <b>원인</b>을 알아보기 위해 찾아보면 좋은 자료를 추천해 드려요.</p></section><section class="panel"><label for="problem">우리 모둠이 선택한 지역 문제는 무엇인가요?</label><textarea id="problem" placeholder="예: 우리 지역 공원에 쓰레기가 많이 버려져 있어요."></textarea><div class="examples"><button class="chip" data-v="공원과 길거리에 쓰레기 무단투기가 많다">🗑️ 쓰레기</button><button class="chip" data-v="학교 주변에 불법 주정차가 많아 등하굣길이 위험하다">🚗 교통·안전</button><button class="chip" data-v="우리 지역의 오래된 시설이 낡고 이용하기 불편하다">🏚️ 노후 시설</button><button class="chip" data-v="바닷가와 하천에 쓰레기가 많아 환경이 오염되고 있다">🌊 환경 오염</button></div><button class="primary" id="go">어떤 자료를 찾아볼까?</button><div id="result" class="hidden"></div></section></main><script>

function suggestions(t,place,p,i){
 if(t?.name==='개발 계획') return t.steps[i][2];
 const key=t?.name,term=sampleTerms[key]?.[i]||['지역 문제 원인 기사','지역 문제 통계 현황','지역 문제 지도 사진','지역 문제 조사 보고서'][i];
 const exact=p.length<25?p.replace(/[.!?]/g,'').trim():null;
 return place+' '+term+', '+(exact&&i===0?exact+' 원인':place+' '+term.split(' ').slice(-2).join(' '));
}
function placeOf(p){let m=p.match(/(?:인천|송도|소래|부평|연수|남동|미추홀|계양|서구|중구|동구|강화|옹진)(?:국제업무지구|국제도시|구|군|동|역|공원|동네)?/);return m?m[0]:'우리 지역'}
document.querySelector('#go').onclick=()=>{
const p=problem.value.trim();if(!p){alert('먼저 우리 모둠의 지역 문제를 입력해 주세요.');problem.focus();return}
const t=topics.find(x=>x.keys.test(p)), place=placeOf(p),subject=t?.source||p.replace(/[.!?]/g,'').slice(0,65);
const steps=t?.steps||fallback;

result.scrollIntoView({behavior:'smooth',block:'start'});
